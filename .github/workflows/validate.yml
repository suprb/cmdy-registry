name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    name: Registry, archives, shaders, and connectors
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            python3 -B -m json.tool "$file" >/dev/null
          done < <(find . -path ./.git -prune -o -type f -name '*.json' -print0)

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -path ./.git -prune -o -type f -name '*.sh' -print0)

      - name: Test fail-closed validator
        run: python3 -B tools/test-validator.py

      - name: Validate catalog, archives, and compile shaders
        run: python3 -B tools/validate.py

      - name: Test first-party Channels offline
        run: python3 -B tools/test-channels.py

      - name: Test Channels against loopback probes
        run: python3 -B tools/test-channel-integrations.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
